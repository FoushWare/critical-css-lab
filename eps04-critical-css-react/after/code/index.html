<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Does CSS block rendering in React? See for yourself how CSS delays page display with client-side rendering."
  />

  <title>Does CSS Block Rendering in React? | Critical CSS Lab</title>

  <!-- Critical CSS inlined -->
  <style>
    /* Critical CSS for above-the-fold content */
    :root {
      --color-primary: #2563eb;
      --color-primary-dark: #1e40af;
      --color-secondary: #64748b;
      --color-background: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #e2e8f0;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-error: #ef4444;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-error: #ef4444;
      --spacing-xs: 0.5rem;
      --spacing-sm: 1rem;
      --spacing-md: 1.5rem;
      --spacing-lg: 2rem;
      --spacing-xl: 3rem;
      --spacing-2xl: 4rem;
      --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --border-radius-sm: 0.375rem;
      --border-radius-md: 0.5rem;
      --border-radius-lg: 0.75rem;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-family-base);
      color: var(--color-text);
      background-color: var(--color-background);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--spacing-lg);
    }

    .site-header {
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md) 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--color-primary);
    }

    .logo-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: white;
      border-radius: var(--border-radius-md);
      font-size: 1.5rem;
    }

    .main-navigation {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .lang-switcher {
      padding: var(--spacing-xs) var(--spacing-sm);
      background-color: var(--color-background);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-sm);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .lang-switcher:hover {
      background-color: var(--color-border);
    }

    .hero {
      padding: var(--spacing-2xl) 0;
      background: linear-gradient(135deg, var(--color-background) 0%, #e0e7ff 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-2xl);
      align-items: center;
    }

    .eyebrow {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--spacing-sm);
    }

    .hero-content h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: var(--spacing-md);
      color: var(--color-text);
    }

    .hero-description {
      font-size: 1.125rem;
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-lg);
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .button {
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: var(--border-radius-md);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .button-primary {
      background-color: var(--color-primary);
      color: white;
      border: none;
    }

    .button-primary:hover {
      background-color: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .button-secondary {
      background-color: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .meta-item strong {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    .meta-item span {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .meta-divider {
      width: 1px;
      height: 2rem;
      background-color: var(--color-border);
    }

    @media (max-width: 768px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }
      
      .hero-content h1 {
        font-size: 2rem;
      }
    }
  </style>

  <!-- Full CSS loaded asynchronously -->
  <link rel="stylesheet" href="styles.css" />
  
  <!-- React and ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX transformation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
